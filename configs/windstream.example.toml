# Windstream configuration (Windows).
# Default location: C:\ProgramData\Windstream\windstream.toml
# Every key is shown with its default. Unknown keys are rejected at startup.
# TOML tip: use single quotes for Windows paths so backslashes stay literal.

[server]
listen = ":8443"            # HTTPS listener: forward this TCP port on your router
# redirect_http = ":80"     # plain-HTTP redirect; required for ACME (Let's Encrypt)
# allowed_origins = []      # extra scheme://host[:port] origins (normally unnecessary)
behind_proxy = false        # trust X-Forwarded-For only behind your own reverse proxy
max_clients = 2             # concurrent streaming sessions

[tls]
# Pick exactly one certificate source.
# 1) Let's Encrypt (recommended): needs a public DNS name (e.g. DuckDNS) pointing
#    at your router, and TCP 80 forwarded to this PC for the HTTP-01 challenge.
# acme = true
# acme_domains = ["games.example.duckdns.org"]
# acme_email = "you@example.com"
# acme_cache_dir = 'C:\ProgramData\Windstream\acme'
# 2) Your own certificate (win-acme, Tailscale `tailscale cert`, ...). Renewals
#    are picked up automatically.
# cert_file = 'C:\ProgramData\Windstream\cert.pem'
# key_file  = 'C:\ProgramData\Windstream\key.pem'
# 3) Testing only (browsers will warn):
self_signed = true

[auth]
session_idle_timeout = "12h"
session_max_age = "168h"
login_rate_limit = 5        # failed logins allowed per IP ...
login_rate_window = "1m"    # ... per window
require_totp = false        # set true once every user has a totp_secret (recommended)

# One entry per account:
#   windstream.exe hash-password            -> password_hash
#   windstream.exe totp-setup -user player  -> totp_secret
[[users]]
name = "player"
password_hash = "$argon2id$v=19$m=65536,t=3,p=4$REPLACE$ME"
# totp_secret = "BASE32SECRET"

[display]
# virtual - turn on the Virtual Display Driver monitor at start (no physical
#           monitor needed), set the mode below, stream it. Recommended.
# monitor - stream an existing monitor or HDMI dummy plug (see `windstream displays`).
# test    - synthetic pattern, for checking the network path.
mode = "virtual"
width = 1920
height = 1080
refresh = 60
make_primary = true                 # games and Big Picture open on the streamed screen
virtual_device = "Virtual Display"  # Device Manager name substring of the VDD adapter
virtual_keep_enabled = false        # leave the virtual monitor on when Windstream exits
monitor = "0"                       # monitor mode: index or '\\.\DISPLAY2'
set_mode = false                    # monitor mode: also apply width/height/refresh
startup_timeout = "15s"
# Started once the display is ready:
# launch = ['C:\Program Files (x86)\Steam\steam.exe', 'steam://open/bigpicture']

[video]
encoder = "auto"            # auto | nvenc | amf | qsv | x264  (auto = first GPU encoder that works)
fps = 60
bitrate_kbps = 15000        # 10000-25000 for 1080p60; stay below ~80% of your upload speed
gop_seconds = 2             # keyframe interval: new viewers and loss recovery wait up to this long
profile = "high"            # high | main | baseline
# preset = ""               # encoder preset (nvenc p1-p7, amf speed|balanced|quality, qsv veryfast..., x264 superfast...)
gpu = 0                     # DXGI adapter for test mode only; capture uses the GPU driving the display
ffmpeg_binary = "ffmpeg"    # or a full path, e.g. 'C:\ffmpeg\bin\ffmpeg.exe'
show_cursor = true
# extra_args = []           # appended to the ffmpeg encoder arguments

[audio]
enabled = true
backend = "wasapi"          # wasapi (what the PC is playing) | dshow | test
device = ""                 # wasapi: playback device name substring ('' = default); dshow: device name
bitrate_kbps = 128

[webrtc]
udp_port = 8444             # all media on one UDP port: forward it on your router
# tcp_port = 8444           # optional ICE-TCP fallback for networks that block UDP
# public_ips = ["203.0.113.5"]  # advertise your public IP directly (static IP only)
stun_servers = ["stun:stun.l.google.com:19302"]
include_loopback = false

[input]
enabled = true
gamepads = true             # needs the ViGEmBus driver + ViGEmClient.dll
keyboard = true
mouse = true
max_gamepads = 4
# vigem_client_dll = ''     # default: next to windstream.exe

[log]
level = "info"              # debug | info | warn | error
format = "text"             # text | json
# file = ''                 # the installer passes -log-file instead
