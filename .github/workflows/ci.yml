name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (linux, ffmpeg integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (pipeline integration tests use the synthetic source)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: make lint
      - run: make test

  windows:
    name: build Windstream.exe (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        shell: bash
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8} -H=windowsgui" -o Windstream.exe ./cmd/windstream
      - name: Smoke test (CLI attaches to the console)
        shell: bash
        run: ./Windstream.exe version

  macos:
    name: build Windstream.app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pinned ffmpeg (the one the app downloads) runs and encodes
        run: |
          curl -sSL -o ffmpeg.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz
          echo "8923876afa8db5585022d7860ec7e589af192f441c56793971276d450ed3bbfa  ffmpeg.gz" | shasum -a 256 -c -
          gunzip ffmpeg.gz && chmod +x ffmpeg
          ./ffmpeg -hide_banner -f lavfi -i testsrc2=s=640x360:r=30 -frames:v 30 -c:v libx264 -f null -
          ./ffmpeg -hide_banner -f lavfi -i testsrc2=s=640x360:r=30 -frames:v 30 -pix_fmt nv12 -c:v h264_videotoolbox -realtime 1 -f null - || echo "::warning::VideoToolbox is not available on this virtual machine"
          ./ffmpeg -hide_banner -f avfoundation -list_devices true -i "" || true
      - run: go vet ./...
      - name: Tests (pipeline tests use the pinned ffmpeg)
        run: WINDSTREAM_TEST_FFMPEG=$PWD/ffmpeg go test ./...
      - name: Build the app bundle
        run: |
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" -o ws-arm64 ./cmd/windstream
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" -o ws-amd64 ./cmd/windstream
          lipo -create -output windstream ws-arm64 ws-amd64
          go run ./tools/macbundle -exe windstream -version "${GITHUB_SHA::8}" -out dist
          codesign --force --deep --sign - dist/Windstream.app
          codesign --verify --deep --strict dist/Windstream.app
          dist/Windstream.app/Contents/MacOS/Windstream version
          dist/Windstream.app/Contents/MacOS/Windstream --tcc-check
      - name: Certificate signing keeps the app's identity across versions
        run: |
          # The release signs with the MACOS_CERTIFICATE_P12 secret; here a
          # throwaway certificate made by the same script (with OpenSSL 3,
          # like the real one) stands in for it. It never leaves this runner.
          PATH="$(brew --prefix openssl@3)/bin:$PATH" scripts/make-mac-signing-cert.sh "$RUNNER_TEMP/cert"
          export MACOS_CERTIFICATE_P12=$(cat "$RUNNER_TEMP/cert/MACOS_CERTIFICATE_P12.txt")
          export MACOS_CERTIFICATE_PASSWORD=$(cat "$RUNNER_TEMP/cert/MACOS_CERTIFICATE_PASSWORD.txt")
          GITHUB_ENV=$RUNNER_TEMP/sign.env .github/scripts/mac-signing-identity.sh
          . "$RUNNER_TEMP/sign.env"
          for v in 1.0.0 2.0.0; do
            GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=$v" -o ws-$v ./cmd/windstream
            go run ./tools/macbundle -exe ws-$v -version $v -out signed-$v
            codesign --force --deep --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_ID" signed-$v/Windstream.app
          done
          DR=$(codesign --display --requirements - signed-1.0.0/Windstream.app 2>&1 | sed -n 's/^designated => //p')
          echo "designated requirement: $DR"
          codesign --verify -R="$DR" signed-2.0.0/Windstream.app
          WINDSTREAM_TEST_SIGNED_APP=$PWD/signed-2.0.0/Windstream.app WINDSTREAM_TEST_ADHOC_APP=$PWD/dist/Windstream.app \
            go test -run TestDesignatedRequirement -v ./internal/macapp
