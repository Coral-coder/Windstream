name: release

# Publishes a GitHub Release with ready-to-run executables whenever a tag
# starting with "v" is pushed, e.g.:  git tag v1.0.0 && git push origin v1.0.0
# It can also be started by hand (Actions > release > Run workflow), which
# creates the tag for you.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (tag v1.0.0 is created)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build Windstream.app (Apple silicon + Intel), ad-hoc signed
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ws-$arch ./cmd/windstream
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o reset-$arch ./cmd/windstream-reset
          done
          lipo -create -output windstream ws-arm64 ws-amd64
          mkdir -p pkg
          go run ./tools/macbundle -exe windstream -version "$VERSION" -out pkg
          lipo -create -output "pkg/Windstream Reset Password" reset-arm64 reset-amd64
          chmod +x "pkg/Windstream Reset Password"
          codesign --force --deep --sign - pkg/Windstream.app
          codesign --force --sign - "pkg/Windstream Reset Password"
          codesign --verify --deep --strict pkg/Windstream.app
          pkg/Windstream.app/Contents/MacOS/Windstream version
          mkdir -p dist
          (cd pkg && ditto -c -k --sequesterRsrc . ../dist/Windstream-macOS.zip)
          unzip -l dist/Windstream-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/Windstream-macOS.zip

  release:
    needs: mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Work out the tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build executables
        shell: bash
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            out=dist/Windstream.exe
            [ "$arch" = arm64 ] && out=dist/Windstream-arm64.exe
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -H=windowsgui" -o "$out" ./cmd/windstream
            # The password reset tool is a console program (it asks questions).
            reset=dist/Windstream-Reset-Password.exe
            [ "$arch" = arm64 ] && reset=dist/Windstream-Reset-Password-arm64.exe
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "$reset" ./cmd/windstream-reset
          done
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist
      - name: Checksums
        shell: bash
        run: (cd dist && sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Download `Windstream.exe`** (or `Windstream-arm64.exe` for ARM PCs), put it on your gaming PC and double-click it.

          It asks for administrator permission once, installs itself, and opens the setup page in your browser.

          **Mac:** download `Windstream-macOS.zip`, open it and double-click **Windstream**. The first time, macOS says it can't check the app: open **System Settings → Privacy & Security** and click **Open Anyway**. Windstream installs itself in Applications, then asks for **Screen Recording** and **Accessibility** permission (needed to stream the screen and to control the mouse and keyboard). For sound, install the free BlackHole 2ch driver (the dashboard explains how).

          **Forgot your password?** Download `Windstream-Reset-Password.exe` (or `-arm64`) and run it on the same PC. It sets a new password, and a new authenticator if you lost that too. Windstream picks the change up within seconds, without a restart.
          NOTES
          gh release create "$TAG" dist/Windstream.exe dist/Windstream-arm64.exe \
            dist/Windstream-Reset-Password.exe dist/Windstream-Reset-Password-arm64.exe \
            dist/Windstream-macOS.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Windstream $TAG" --notes-file notes.md --latest
