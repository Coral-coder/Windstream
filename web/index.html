<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#071a1f">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Windstream</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Windstream">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="login" class="screen">
  <form id="login-form" class="card" autocomplete="on">
    <img class="logo" src="/logo.png" alt="" width="96" height="96">
    <h1>Windstream</h1>
    <p class="muted">Sign in to your game server.</p>
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <label id="totp-row" class="hidden">Authenticator code <input name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6"></label>
    <button type="submit" id="login-btn">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
    <p class="muted forgot">Forgot your password? On the gaming PC, run <b>Windstream-Reset-Password.exe</b> (from the same download page as Windstream).</p>
  </form>
</main>

<main id="stream" class="screen hidden">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <audio id="audio" autoplay muted></audio>
    <div id="overlay" class="overlay">
      <div id="status" class="status">Connecting…</div>
    </div>
    <pre id="stats" class="stats hidden"></pre>
    <div id="toast" class="toast hidden" role="status"></div>
    <input id="kbd" class="kbd" aria-label="Type on the PC" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
  </div>
  <nav id="toolbar">
    <span class="brand"><img src="/favicon.png" alt=""> Windstream</span>
    <span id="pads" class="pads" title="Connected controllers">🎮 0</span>
    <span class="spacer"></span>
    <select id="sel-res" title="Largest picture to stream: the PC's screen switches to fit while you watch">
      <option value="auto">This screen</option>
      <option value="2160">4K</option>
      <option value="1440">1440p</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="none">No limit</option>
    </select>
    <button id="btn-keyboard" class="hidden" title="Keyboard">⌨</button>
    <button id="btn-mouse" class="toggle hidden" aria-pressed="true">🖱</button>
    <button id="btn-mute" title="Toggle audio">🔇</button>
    <button id="btn-stats" title="Toggle stats">📈</button>
    <button id="btn-fullscreen" title="Fullscreen">⛶</button>
    <button id="btn-logout" title="Sign out">⏏</button>
  </nav>
</main>
<script src="/app.js"></script>
</body>
</html>
