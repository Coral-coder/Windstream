<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#071a1f">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Windstream</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="login" class="screen">
  <form id="login-form" class="card" autocomplete="on">
    <img class="logo" src="/logo.png" alt="" width="96" height="96">
    <h1>Windstream</h1>
    <p class="muted">Sign in to your game server.</p>
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <label id="totp-row" class="hidden">Authenticator code <input name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6"></label>
    <button type="submit" id="login-btn">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</main>

<main id="stream" class="screen hidden">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <audio id="audio" autoplay muted></audio>
    <div id="overlay" class="overlay">
      <div id="status" class="status">Connecting…</div>
    </div>
    <pre id="stats" class="stats hidden"></pre>
  </div>
  <nav id="toolbar">
    <span class="brand"><img src="/favicon.png" alt=""> Windstream</span>
    <span id="pads" class="pads" title="Connected controllers">🎮 0</span>
    <span class="spacer"></span>
    <button id="btn-mute" title="Toggle audio">🔇</button>
    <button id="btn-stats" title="Toggle stats">📈</button>
    <button id="btn-fullscreen" title="Fullscreen">⛶</button>
    <button id="btn-logout" title="Sign out">⏏</button>
  </nav>
</main>
<script src="/app.js"></script>
</body>
</html>
